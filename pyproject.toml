[project]
name = "qrclaw"
version = "0.7.5"
description = "A powerful AI agent with skills system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Fu Qingrong", email = "fu.qingrong@example.com"}
]
keywords = ["ai", "agent", "cli", "skills", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "tavily-python>=0.7.0",
    "httpx>=0.27.0",
    "prompt_toolkit>=3.0.0",
    "pyyaml>=6.0.0",
    "tiktoken>=0.5.0",
    "google-genai>=1.0.0",
    "ddgs>=7.0.0",
    "google-api-python-client>=2.0.0",
]

[project.optional-dependencies]
sandbox = [
    "docker>=7.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
qrclaw = "qrclaw.cli:main"

[project.urls]
Homepage = "https://github.com/fu-qingrong/qrclaw"
Repository = "https://github.com/fu-qingrong/qrclaw"
Issues = "https://github.com/fu-qingrong/qrclaw/issues"
Documentation = "https://github.com/fu-qingrong/qrclaw#readme"

[tool.hatch.build.targets.wheel]
packages = ["qrclaw"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"