[project]
name = "javaclaw"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "tavily-python>=0.7.0",
    "httpx>=0.27.0",
]

[project.scripts]
javaclaw = "javaclaw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
