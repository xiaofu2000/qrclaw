[project]
name = "qrclaw"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "tavily-python>=0.7.0",
    "httpx>=0.27.0",
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
qrclaw = "javaclaw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["javaclaw"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
