/* 极简 Markdown：段落、加粗、行内代码、列表、引用、二级标题。仅用于原型展示。 */
window.md = function (src) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  return src.split(/\n{2,}/).map(block => {
    const lines = block.split('\n')
    if (lines.every(l => l.startsWith('- '))) return '<ul>' + lines.map(l => '<li>' + inline(l.slice(2)) + '</li>').join('') + '</ul>'
    if (lines[0].startsWith('## ')) return '<h3>' + inline(lines[0].slice(3)) + '</h3>' + (lines.length > 1 ? window.md(lines.slice(1).join('\n')) : '')
    if (lines.every(l => l.startsWith('> '))) return '<blockquote>' + inline(lines.map(l => l.slice(2)).join(' ')) + '</blockquote>'
    const head = lines.findIndex(l => l.startsWith('- '))
    if (head > 0) return '<p>' + lines.slice(0, head).map(inline).join('<br>') + '</p>' + window.md(lines.slice(head).join('\n'))
    return '<p>' + lines.map(l => l.startsWith('> ') ? '</p><blockquote>' + inline(l.slice(2)) + '</blockquote><p>' : inline(l)).join('<br>').replace(/<br><\/p>/g, '</p>').replace(/<p><br>/g, '<p>') + '</p>'
  }).join('')
}

.wrote a.pending{opacity:.28;pointer-events:none}
.replay{font:12px var(--mono);color:var(--blue);border:1px solid currentColor;padding:5px 10px;border-radius:2px;margin-top:12px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;margin-top:8px}
.bars i{height:5px;background:var(--ink);opacity:.75}
.marker{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cursor);margin-right:6px;vertical-align:1px}

/* 记忆视图 */
.memory{display:none;grid-template-columns:300px minmax(0,1fr) 280px;min-height:0}
[data-view=memory] .memory{display:grid}
[data-view=memory] .desk{display:none}
.toc{border-right:1px solid var(--rule);overflow:auto;padding:40px 0 20px}
.toc h2{font:600 22px var(--serif);margin:0 24px 4px}
.toc .sub{font:12px var(--mono);color:var(--meta);margin:0 24px 14px}
.toc input{margin:0 24px 14px;width:calc(100% - 48px);border:0;border-bottom:1px solid var(--ink);background:transparent;font:14px var(--sans);padding:8px 0;color:var(--ink);outline:0}
.toc button{display:block;width:100%;text-align:left;padding:9px 24px;border-left:2px solid transparent}
.toc button:hover{background:var(--soft)}
.toc button[aria-current]{border-left-color:var(--cursor);background:var(--soft)}
.toc button b{display:block;font-weight:500;font-size:14px;line-height:1.5}
.toc button span{font:12px var(--mono);color:var(--meta)}
.page{overflow:auto;padding:46px 56px}
.page .prose h3{font:600 19px/1.6 var(--serif);margin:1.6em 0 .5em}
.page-actions{font:12px var(--mono);color:var(--meta);display:flex;gap:18px;margin:0 0 30px}
.page-actions button{color:var(--blue)}

@media (max-width:1180px){.desk{grid-template-columns:1fr}.margin{display:none}.inline-notes{display:block!important}.memory{grid-template-columns:260px 1fr}.memory .margin{display:none}}
.inline-notes{display:none;font:12px/1.8 var(--mono);color:var(--meta);border-left:2px solid var(--cursor);padding-left:12px;margin:0 0 20px}
.inline-notes a{color:var(--blue)}
.topbar{display:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .index{position:fixed;inset:0 auto 0 0;width:86vw;max-width:320px;background:var(--paper);z-index:5;transform:translateX(-100%);transition:transform .25s}
  .app.nav-open .index{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.25)}
  .topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rule)}
  .topbar button{width:44px;height:44px;font:20px var(--mono)}
  .topbar img{width:34px;height:34px}
  .topbar span{font:12px var(--mono);color:var(--meta)}
  .column{padding:24px 16px 0}
  .doc-title{font-size:20px}
  .prose{font-size:16px;line-height:1.9}
  .memory{grid-template-columns:1fr}.toc{display:none}.page{padding:24px 16px}
}
</style></head>

  $('calls').innerHTML = Q.turn.tools.map((c, i) => `<li class="${i < done ? '' : i === live ? 'live' : 'pending'}"><span>${c.at.slice(0, 5)}</span><span>${i === live ? '<span class=marker></span>' : ''}${c.t}</span><em>${i < done ? c.d : i === live ? '进行中' : ''}</em></li>`).join('')
  $('wrote').innerHTML = Q.turn.wrote.map(name => {
    const idx = Q.turn.tools.findIndex(c => c.page === name)
    return `<a href="#memory" data-page="${name}" class="${idx < done ? '' : 'pending'}">${name}</a>`
  }).join('') + `<div>${done >= Q.turn.tools.length ? '本轮写入 2 页，来源可回溯到这条消息' : '写入后出现在这里'}</div>`
  $('inlineNotes').innerHTML = `${done}/${Q.turn.tools.length} 次调用 · ${Q.turn.duration} · 留进记忆：${Q.turn.wrote.map(n => `<a href="#memory" data-page="${n}">${n}</a>`).join('、')}`
}
renderCalls()

/* 回放：按事件日志顺序逐条点亮，最后流式写出回复 */
let timer
$('replay').onclick = () => {
  clearInterval(timer)
  const reply = Q.turn.reply
  let step = 0
  $('reply').innerHTML = '<span class="caret"></span>'
  setStatus('正在思考')
  renderCalls(0, 0)
  timer = setInterval(() => {
    if (step < Q.turn.tools.length) {
      step++
      renderCalls(step, step < Q.turn.tools.length ? step : -1)
      setStatus(step < Q.turn.tools.length ? '正在调用 ' + Q.turn.tools[step].t : '正在写回复')
      return
    }
    clearInterval(timer)
    let n = 0
    timer = setInterval(() => {
      n += 14
      $('reply').innerHTML = md(reply.slice(0, n)) + '<span class="caret"></span>'
      if (n >= reply.length) { clearInterval(timer); $('reply').innerHTML = md(reply); setStatus('本轮已完成') }
    }, 40)
  }, 650)
}
function setStatus(text) { $('status').textContent = text; $('status').className = text === '本轮已完成' ? '' : 'live'; $('mStatus').textContent = text }

document.addEventListener('click', e => {
  if (e.target.id === 'focusBtn') { const on = $('doc').classList.toggle('focus'); e.target.textContent = '专注当前轮：' + (on ? '开' : '关') }
  if (e.target.id === 'plan') e.target.setAttribute('aria-checked', e.target.getAttribute('aria-checked') !== 'true')
  const link = e.target.closest('[data-page]')
  if (link) { e.preventDefault(); openMemory(link.dataset.page) }
  if (e.target.closest('#memlink')) openMemory(Q.page.name)
  if (e.target.closest('.sess')) { app.dataset.view = 'chat'; $('memlink').removeAttribute('aria-current') }
})

function openMemory(name) {
  app.dataset.view = 'memory'
  $('memlink').setAttribute('aria-current', 'page')
  $('toc').innerHTML = Q.memory.map(m => `<button type="button" data-open="${m.name}" ${m.name === name ? 'aria-current="page"' : ''}><b>${m.name}</b><span>${m.updated} · ${m.sources ? m.sources + ' 个来源' : '来源未追溯'}</span></button>`).join('')
  const meta = Q.memory.find(m => m.name === name)
  const full = name === Q.page.name
  $('page').innerHTML = `<h1 class="doc-title">${name}</h1>
    <div class="doc-meta">${meta.status === 'ready' ? '可用' : '来源未追溯'} · ${full ? '版本 ' + Q.page.revision + ' · ' : ''}更新于 ${meta.updated} · ${meta.tags.join(' / ')}</div>
    <div class="page-actions"><button type="button">编辑</button><button type="button">删除</button></div>
    <div class="prose">${full ? md(Q.page.content) : '<p>' + meta.desc + '</p><p style="color:var(--meta);font:13px var(--mono)">（原型只载入了「QRClaw Skill 机制」的正文）</p>'}</div>`
  $('pageMargin').innerHTML = full ? `<div class="note"><h4>来源 · 2</h4>${Q.page.sources.map(s => `<div>${s.role} · ${s.at}</div>`).join('')}<a href="#" class="replay" style="display:inline-block;text-decoration:none" onclick="event.preventDefault();app.dataset.view='chat'">回到原会话这一轮</a></div>
    <div class="note"><h4>它链接到</h4>${Q.page.links.map(l => `<div><a href="#" data-page="${l}" style="color:var(--blue)">${l}</a></div>`).join('')}</div>
    <div class="note"><h4>谁引用了它</h4>${Q.page.backlinks.map(l => `<div><a href="#" data-page="${l}" style="color:var(--blue)">${l}</a></div>`).join('')}</div>`
    : `<div class="note"><h4>来源</h4><div>${meta.sources ? meta.sources + ' 条来源' : '历史页面，来源未追溯'}</div></div>`
}
document.addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) openMemory(b.dataset.open) })
if (location.hash === '#memory') openMemory(Q.page.name)
</script>
</body></html>
