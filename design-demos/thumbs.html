<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QRClaw 六个候选</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9d9d6;--ink:#1b1b1b}
body{margin:0;background:var(--bg);font-family:"Noto Sans SC",sans-serif;color:var(--ink);padding:28px}
h1{font-size:18px;font-weight:500;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(3,480px);gap:26px 22px}
figure{margin:0}
figcaption{font-size:13px;margin-top:8px;line-height:1.5}
figcaption b{font-weight:700}
.cell{width:480px;height:300px;overflow:hidden;position:relative;outline:1px solid rgba(0,0,0,.15)}
.mini{width:960px;height:600px;transform:scale(.5);transform-origin:0 0;position:absolute;inset:0}
img.bl{display:block}

/* A iA 工作文档 */
.a{background:#fbfbfa;color:#1d1d1f;display:grid;grid-template-columns:150px 1fr 190px}
.a .idx{border-right:1px solid #e7e7e4;padding:26px 18px;font:12px/1.9 "IBM Plex Mono",monospace;color:#8a8a86}
.a .idx b{display:block;color:#1d1d1f;font-weight:500;margin-bottom:10px}
.a .idx .on{color:#1d1d1f}
.a .doc{padding:40px 46px 0;font-family:"Noto Serif SC",serif}
.a .old{color:#b9b9b4;font-size:16px;line-height:1.9}
.a .q{font:500 13px/1.6 "IBM Plex Mono",monospace;color:#0a84c6;margin:22px 0 8px}
.a .now{font-size:17px;line-height:1.95}
.a .cur{display:inline-block;width:2px;height:20px;background:#00a3ff;vertical-align:-4px}
.a .margin{padding:118px 16px 0 0;font:11.5px/1.8 "IBM Plex Mono",monospace;color:#6d6d69}
.a .margin p{margin:0 0 14px;border-left:2px solid #00a3ff;padding-left:8px}

/* B TE 仪器 */
.b{background:#e3e3df;color:#111;font-family:"Noto Sans SC",sans-serif}
.b .bar{display:grid;grid-template-columns:180px 1fr 130px;border-bottom:2px solid #111;height:190px}
.b .screen{background:#151515;margin:16px;border-radius:6px;display:grid;place-items:center;position:relative}
.b .screen span{position:absolute;bottom:8px;left:10px;font:11px "JetBrains Mono",monospace;color:#ff4f00}
.b .seq{padding:18px 10px;border-left:1px solid #111;border-right:1px solid #111}
.b .lbl{font:10px "JetBrains Mono",monospace;letter-spacing:.06em}
.b .steps{display:grid;grid-template-columns:repeat(36,1fr);gap:3px;margin-top:10px}
.b .steps i{height:22px;border-radius:2px;background:#c9c9c4}
.b .steps i.s{background:#111}.b .steps i.r{background:#3f6bd8}.b .steps i.w{background:#ffc800}.b .steps i.m{background:#2a9d6f}.b .steps i.now{background:#ff4f00}
.b .dial{display:grid;place-items:center}
.b .dial div{width:86px;height:86px;border-radius:50%;background:conic-gradient(#111 0 30%,#c9c9c4 0);display:grid;place-items:center}
.b .dial div b{width:64px;height:64px;border-radius:50%;background:#e3e3df;display:grid;place-items:center;font:700 16px "JetBrains Mono",monospace}
.b .tracks{display:grid;grid-template-columns:1fr 300px;height:410px}
.b .talk{padding:24px 30px;font-size:15px;line-height:1.85}
.b .talk h3{font:700 22px/1.4 "Noto Sans SC";margin:6px 0 12px}
.b .subs{border-left:1px solid #111;padding:18px}
.b .sub{border:1px solid #111;padding:8px 10px;margin-bottom:8px;font-size:12px;line-height:1.6;background:#ececE8}
.b .sub b{font-family:"JetBrains Mono";color:#ff4f00}

/* C Linear 工作项 */
.c{background:#101012;color:#e4e4e6;font-family:Inter,"Noto Sans SC",sans-serif;display:grid;grid-template-columns:210px 1fr 230px}
.c .nav{background:#0b0b0d;border-right:1px solid #232326;padding:18px 12px;font-size:13px;color:#9d9da3}
.c .nav .grp{margin:18px 0 6px;font-size:11.5px;color:#6e6e75}
.c .nav .it{padding:6px 8px;border-radius:6px;display:flex;justify-content:space-between}
.c .nav .it.on{background:#1d1d21;color:#ededf0}
.c .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;background:#4f6ef7}
.c .main{padding:26px 34px}
.c .main h2{font-size:21px;font-weight:600;margin:0 0 6px;line-height:1.4}
.c .sys{font-size:12.5px;color:#7c7c84;margin:10px 0;display:flex;gap:8px;align-items:center}
.c .sys:before{content:"";width:6px;height:6px;border-radius:50%;background:#55555c}
.c .msg{background:#17171a;border:1px solid #232326;border-radius:8px;padding:14px 16px;font-size:14.5px;line-height:1.8;margin:12px 0}
.c .props{border-left:1px solid #232326;padding:22px 18px;font-size:12.5px}
.c .props .k{color:#6e6e75;margin-top:14px}
.c .props .v{color:#e4e4e6;margin-top:4px}

/* D Warp 点阵 */
.d{background:#fff;color:#111;font-family:"JetBrains Mono",monospace}
.d .head{padding:30px 40px 10px;font-size:30px;line-height:1.25;font-family:"JetBrains Mono","Noto Sans SC";letter-spacing:-.02em}
.d .blk{margin:10px 40px;border:1px solid #d9d9e3;display:grid;grid-template-columns:1fr 330px}
.d .blk .t{padding:16px 18px;font:14px/1.8 "Noto Sans SC";border-right:1px solid #d9d9e3}
.d .blk .t code{font-family:"JetBrains Mono";background:#f1f1f6;padding:1px 4px}
.d .dots{padding:14px;display:grid;grid-template-columns:repeat(18,1fr);gap:6px;align-content:start}
.d .dots i{width:9px;height:9px;background:#dcdce4}
.d .dots i.on{background:#2b2bd9}.d .dots i.y{background:#e9f75c;outline:1px solid #111}
.d .cap{font-size:11px;color:#777;padding:0 14px 10px;grid-column:2}
.d .btn{position:absolute;right:40px;top:34px;background:#e9f75c;border:1px solid #111;padding:8px 14px;font-size:13px}

/* E 像素 */
.e{background:#2c2a4a;color:#fff;font-family:"Noto Sans SC"}
.e .scene{height:260px;background:linear-gradient(#5dadE2 0 62%,#4caf50 62% 78%,#3b8a3e 78%);position:relative;image-rendering:pixelated;border-bottom:6px solid #111}
.e .hud{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;font:10px/1.6 "Press Start 2P";color:#fff;text-shadow:2px 2px 0 #111}
.e .blocks{position:absolute;bottom:62px;left:260px;display:flex;gap:26px}
.e .blocks i{width:26px;height:26px;background:#e8743b;box-shadow:inset -4px -4px 0 #a54d22,inset 4px 4px 0 #f6a26f}
.e .blocks i.q{background:#ffd23f;box-shadow:inset -4px -4px 0 #b88d0e,inset 4px 4px 0 #fff2a6}
.e .hero{position:absolute;bottom:56px;left:120px}
.e .talk{padding:22px 34px;font-size:15px;line-height:1.85;background:#1d1b33;height:340px}
.e .talk b{font:11px "Press Start 2P";color:#1abc9c}

/* F 田中一光 */
.f{background:#efe9dc;color:#161616;display:grid;grid-template-columns:600px 1fr;font-family:"Noto Sans SC"}
.f .comp{padding:40px;display:grid;grid-template-columns:repeat(7,70px);grid-template-rows:repeat(7,70px)}
.f .comp i{display:block}
.f .r{background:#d9381e}.f .k{background:#161616}.f .y{background:#e2b23a}.f .bl{background:#2f5d8a}
.f .circle{border-radius:50%}.f .q1{border-radius:70px 0 0 0}.f .q2{border-radius:0 70px 0 0}.f .q3{border-radius:0 0 70px 0}
.f .side{padding:44px 34px 0 0;border-left:0}
.f .side h2{font:900 48px/1.15 "Noto Serif SC",serif;writing-mode:vertical-rl;height:260px;margin:0 0 0 auto}
.f .tag{display:inline-block;background:#d9381e;color:#fff;font-size:11px;padding:1px 6px;margin:14px 0 4px}
.f .side p{margin:0;font-size:13px;line-height:1.7}
</style></head>
